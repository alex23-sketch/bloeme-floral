services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bloeme}
      POSTGRES_USER: ${POSTGRES_USER:-bloeme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bloeme}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-bloeme}
    depends_on:
      db:
        condition: service_healthy
    ports: ["${API_HOST_PORT:-8000}:8000"]
    volumes:
      - media_data:/app/backend/media
volumes:
  postgres_data:
  media_data:
