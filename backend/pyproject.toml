[project]
name = "bloeme-floral-api"
version = "1.0.0"
description = "BLOOMÉ FLORAL Business PRO API — FastAPI + PostgreSQL"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
